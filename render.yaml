services:
  - type: web
    name: taskcore-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: taskcore-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://mrjgames.github.io,https://taskcore-api-rlvr.onrender.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: taskcore-postgres
    plan: free
    region: oregon
    databaseName: taskcore
    user: taskcore
