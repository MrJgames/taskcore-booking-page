    <text x="88" y="251">Palm Springs</text>
    <text x="221" y="230">Cathedral City</text>
    <text x="337" y="154">Thousand Palms</text>
    <text x="298" y="329">Rancho Mirage</text>
    <text x="402" y="286">Palm Desert</text>
    <text x="500" y="237">Bermuda Dunes</text>
    <text x="431" y="385">Indian Wells</text>
    <text x="516" y="445">La Quinta</text>
    <text x="616" y="314">Indio</text>
    <text x="665" y="435">Coachella</text>
