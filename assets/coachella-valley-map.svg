  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="28" y="34" fill="#f1d47a" font-size="13" font-weight="800" letter-spacing="2.4">COACHELLA VALLEY</text>
    <text x="28" y="52" fill="#77766f" font-size="10" letter-spacing="1.7">PRIMARY SERVICE COMMUNITIES</text>
    <g transform="translate(781 31)"><path d="M0 24V-7M0-7l-7 12M0-7l7 12" stroke="#f1d47a" stroke-width="2"/><text x="-5" y="42" fill="#f1d47a" font-size="12" font-weight="800">N</text></g>
  </g>
  <rect x="1" y="1" width="818" height="558" rx="15" fill="none" stroke="#c7a64b" stroke-opacity=".48"/>
