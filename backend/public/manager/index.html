<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TaskCore Property Manager</title><link rel="stylesheet" href="../operations.css"><script src="./manager.js" defer></script></head><body><header><p class="eyebrow">TaskCore Property Manager</p><h1>Property operations</h1><nav class="nav" id="nav" hidden><button data-view="dashboard">Dashboard</button><button data-view="properties">Properties</button><button data-view="requests">Service Requests</button><button data-view="approvals">Approvals</button><button id="new-request">New Service Request</button></nav></header><main><section id="login" class="panel"><h2>Sign in</h2><form id="login-form"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button><output></output></form></section><section id="app" hidden><div id="summary" class="cards"></div><section id="content"></section><form id="request-form" class="panel" hidden><h2>New Service Request</h2><label>Property<select name="propertyId" required></select></label><label>Title<input name="title" required maxlength="160"></label><label>Category<input name="category" required maxlength="100"></label><label>Description<textarea name="description" required rows="5"></textarea></label><label>Priority<select name="priority"><option>Routine</option><option>Soon</option><option>Urgent</option></select></label><label>Occupancy status<input name="occupancyStatus" required></label><label><input name="permissionToEnter" type="checkbox"> Permission to enter</label><label>Preferred date<input name="preferredServiceDate" type="date"></label><label>Preferred window<input name="preferredServiceWindow"></label><label>Spending authorization limit ($)<input name="spendingLimit" type="number" min="0" step=".01"></label><label>Access instructions<textarea name="accessInstructions"></textarea></label><label>Additional notes<textarea name="additionalNotes"></textarea></label><button>Submit to TaskCore</button><button type="button" id="cancel-request">Cancel</button><output></output></form></section></main></body></html>
